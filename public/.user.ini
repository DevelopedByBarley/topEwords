; A PHP-cap az app-szintű feltöltési limitekhez igazodik, hogy a webszerver ne
; fogadjon el és írjon temp-fájlba akkora bodyt, amit a validáció eldob.
;
; A két feltöltés az appban:
;   - EPUB könyv:   3 MB (TextAnalysisController::MAX_BOOK_UPLOAD_KB)
;   - flashcard CSV: 2 MB (FlashcardCsvController, max:2048)
;
; A post_max_size a multipart-overhead és a JSON-POST-ok miatt bővebb; a legnagyobb
; mért JSON-payload az appban ~0,3 MB, tehát 8M kényelmes tartalék.
upload_max_filesize = 4M
post_max_size = 8M
